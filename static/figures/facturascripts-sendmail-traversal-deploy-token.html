// Shared live runtime, inlined into every figure page after the kit.
// A figure is a pure function of cycle time t and one boolean: the bug (false) or the fix (true).
// This drives the idle tour (alternating bug and fix), hover scrubbing, arrow-key steps,
// the fix toggle, the offscreen pause and reduced motion, and writes the readout.
function runFigure({ cycle, scrubEnd, steps, draw, phase, label }) {
  const stage = document.querySelector(".iso-stage");
  const svg = stage.querySelector("svg");
  const readout = document.querySelector("[data-readout]");
  const live = document.querySelector("[data-live]");
  const button = document.querySelector("[data-fix]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const settledAt = steps[steps.length - 1];

  let fixed = false,
    t = 0,
    goal = 0,
    touring = !still.matches,
    visible = false,
    frame = 0,
    last = 0,
    idle = 0,
    said = "";
  if (still.matches) t = goal = settledAt;

  const say = (text, announce) => {
    if (readout.textContent !== text) readout.textContent = text;
    if (announce && live.textContent !== text) live.textContent = text;
  };
  // A figure without a documented fix has no toggle; its tour just loops the bug
  const sync = () => {
    if (!button) return;
    button.setAttribute("aria-pressed", String(fixed));
    button.textContent = label(fixed);
  };
  const render = () => {
    draw(t, fixed);
    const text = phase(t, fixed);
    if (text !== said) {
      said = text;
      say(text, !touring);
    }
  };

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    if (touring) {
      goal += dt;
      if (goal >= cycle) {
        goal -= cycle;
        if (button) {
          fixed = !fixed;
          sync();
        }
      }
      t = goal;
    } else {
      t = still.matches ? goal : t + (goal - t) * (1 - Math.exp(-dt / 0.25));
      if (Math.abs(goal - t) < 0.002) t = goal;
    }
    render();
    frame =
      visible && (touring || t !== goal) ? requestAnimationFrame(tick) : 0;
  }
  const run = () => {
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };

  // Any input stops the tour where it is; it resumes 3.6 s after the last one
  function takeOver() {
    touring = false;
    clearTimeout(idle);
    if (!still.matches)
      idle = setTimeout(() => {
        touring = true;
        goal = t;
        run();
      }, 3600);
  }

  button?.addEventListener("click", () => {
    fixed = !fixed;
    sync();
    clearTimeout(idle);
    // Replay from the start so the reader watches the whole run in the new mode
    if (still.matches) {
      t = goal = settledAt;
      render();
      return;
    }
    touring = true;
    t = goal = 0;
    render();
    run();
  });

  stage.addEventListener("pointermove", (event) => {
    if (event.pointerType !== "mouse") return;
    const box = svg.getBoundingClientRect();
    const share = Math.min(
      1,
      Math.max(0, ((event.clientX - box.left) / box.width - 0.12) / 0.76),
    );
    takeOver();
    goal = share * scrubEnd;
    run();
  });

  stage.addEventListener("keydown", (event) => {
    if (button && (event.key === " " || event.key === "Enter")) {
      event.preventDefault();
      button.click();
      return;
    }
    const here = steps.reduce(
      (best, s, i) =>
        Math.abs(s - goal) < Math.abs(steps[best] - goal) ? i : best,
      0,
    );
    let next = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp")
      next = steps[Math.min(steps.length - 1, here + 1)];
    if (event.key === "ArrowLeft" || event.key === "ArrowDown")
      next = steps[Math.max(0, here - 1)];
    if (event.key === "Home") next = steps[0];
    if (event.key === "End") next = settledAt;
    if (next === null) return;
    event.preventDefault();
    takeOver();
    goal = next;
    run();
  });
  stage.addEventListener("focus", () => say(said, true));

  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    touring = !still.matches;
    if (still.matches) t = goal = settledAt;
    render();
    run();
  });
  sync();
  render();
}

// Smoothstep from a to b; the easing every figure uses for scripted moves
function ease(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

const P = {"origin":[300,234.2543504834373],"scale":1.3306298193238728,"azimuth":45,"elevation":30};
const LEVEL_Z = [11.6,23.6,35.6,47.6], SHELF_Z = [6,18,30,42], CARD_Z = 45;
const WHEELS = [-14,-1,12,25], WHEEL_Y = -30, WHEEL_R = 5, STATION_TOP = 8;
const TUBE = {"from":-70,"to":-20}, KEY_PATH = {"y":-37.4,"from":32,"to":64}, KEY_Z = 9;
const BREAKERS = [58,65,72,79,86], BREAKER_Z = 28;
const CARD_X = -102, RAIL_X = -70;
const T = { climb: [0.9, 2.4], pick: 2.6, down: [2.9, 3.9], tube: [4.1, 5.1], wheels: [5.2, 6.2], key: [6.3, 7.2], trip: [7.5, 8.1], reset: 10.4, cycle: 12 };
const TARGETS = [0.31, 0.62, 0.17, 0.58]; // name, user, password, server hour
const needleD = (x, turn) => {
  const a = turn * Math.PI * 2;
  return lineOnTop([x - Math.sin(a) * 1, WHEEL_Y + Math.cos(a) * 1], [x + Math.sin(a) * (WHEEL_R - 1.2), WHEEL_Y - Math.cos(a) * (WHEEL_R - 1.2)], STATION_TOP + 3.1, P);
};
const leversD = (offs) =>
  BREAKERS.map((x, i) => `M${x} ${-BREAKER_Z}L${x} ${-(BREAKER_Z + (offs[i] ? -3.6 : 3.6))}`).join("");

const svg = document.querySelector(".iso-stage svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const armPart = part("arm"), card = part("card"), capsule = part("capsule"), keyPart = part("key"), levers = part("levers"), fix = part("fix"), online = part("lamp-online");
const needles = WHEELS.map((_, i) => part("needle-" + i));
const slots = [0, 1, 2, 3].map((i) => svg.querySelector('[data-slot="' + i + '"]'));

function armZ(t, fixed) {
  if (fixed) {
    // The collar stops the first ../ : a short climb and a bounce back
    const bump = ease(T.climb[0], T.climb[0] + 0.25, t) * (1 - ease(T.climb[0] + 0.25, T.climb[0] + 0.6, t));
    return LEVEL_Z[0] + 3 * bump;
  }
  const up = ease(...T.climb, t) * 3;
  const level = up * (1 - ease(...T.down, t));
  const lo = Math.floor(level), hi = Math.min(3, lo + 1);
  return LEVEL_Z[lo] + (LEVEL_Z[hi] - LEVEL_Z[lo]) * (level - lo);
}

function phaseOf(t, fixed) {
  if (t >= T.reset) return "resetting";
  if (t < T.climb[0]) return "fileName=../../../config.php";
  if (fixed) return "realpath outside Email/ · not attached";
  if (t < T.pick) return "../ ×3 · out of MyFiles/Tmp/Email";
  if (t < T.wheels[0]) return "config.php emailed · FS_DB_PASS";
  if (t < T.key[0]) return "md5(name.user.pass.date('Y-m-d H'))";
  if (t < T.trip[0]) return "/Deploy?action=disable-plugins";
  return "every plugin off · no session";
}

runFigure({
  cycle: T.cycle,
  scrubEnd: 10.2,
  steps: [0.2, T.climb[1], T.down[1], T.tube[1], T.wheels[1], T.trip[1] + 0.4],
  label: (fixed) => (fixed ? "Fixed: realpath stays in Email/" : "Apply the fix: check realpath"),
  phase: phaseOf,
  draw(t, fixed) {
    const back = 1 - ease(T.reset, T.reset + 0.6, t);
    fix.style.opacity = fixed ? "1" : "0";
    const z = armZ(t, fixed);
    let level = 0;
    for (let i = 0; i < 4; i++) if (z >= LEVEL_Z[i] - 0.5) level = i;
    if (armPart.parentNode !== slots[level]) slots[level].appendChild(armPart);
    armPart.setAttribute("transform", translateAlong(P, [0, 0, z]));
    // The config card rides the arm from the moment it is picked until it drops into the capsule
    const carried = !fixed && t >= T.pick && t < T.tube[0];
    if (carried) {
      if (card.parentNode !== armPart) armPart.appendChild(card);
      card.setAttribute("transform", translateAlong(P, [0, 0, 1.6]));
    } else {
      if (card.nextElementSibling !== slots[3]) slots[3].parentNode.insertBefore(card, slots[3]);
      card.setAttribute("transform", translateAlong(P, [0, 0, CARD_Z]));
    }
    card.style.opacity = (fixed ? 1 : t < T.tube[0] ? 1 : ease(T.reset, T.reset + 0.4, t)).toFixed(3);
    const travel = fixed ? 0 : ease(...T.tube, t);
    capsule.setAttribute("transform", translateAlong(P, [TUBE.from + (TUBE.to - TUBE.from) * travel, 0, 0]));
    capsule.style.opacity = (fixed ? 0 : ease(T.tube[0] - 0.15, T.tube[0], t) * (1 - ease(T.tube[1], T.tube[1] + 0.3, t))).toFixed(3);
    const set = fixed ? 0 : ease(...T.wheels, t) * back;
    needles.forEach((n, i) => n.setAttribute("d", needleD(WHEELS[i], TARGETS[i] * set)));
    const kx = KEY_PATH.from + (KEY_PATH.to - KEY_PATH.from) * ease(...T.key, t);
    keyPart.setAttribute("transform", translateAlong(P, [kx, 0, KEY_Z]));
    keyPart.style.opacity = (fixed ? 0 : ease(T.key[0], T.key[0] + 0.2, t) * back).toFixed(3);
    const offs = BREAKERS.map((_, i) => !fixed && ease(T.trip[0] + i * 0.1, T.trip[0] + i * 0.1 + 0.15, t) * back > 0.5);
    levers.setAttribute("d", leversD(offs));
    online.style.opacity = (fixed || t < T.trip[0] + 0.5 || t >= T.reset ? 1 : 0).toString();
  },
});

const reportHeight = () => parent.postMessage({ figure: "facturascripts-sendmail-traversal-deploy-token", height: Math.ceil(document.body.getBoundingClientRect().height) }, "/");
new ResizeObserver(reportHeight).observe(document.body);
addEventListener("message", (e) => { if (e.origin === location.origin && e.data === "figure:measure") reportHeight(); });
</script></body></html>
