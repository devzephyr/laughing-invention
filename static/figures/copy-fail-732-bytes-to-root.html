tton></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>authencesn scratch stylus: writes 4 bytes past the tag</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Page cache: the pages every read, mmap and execve of su share</span></span><span class="iso-caption">splice() passes the page cache's own pages of /usr/bin/su to the AF_ALG socket by reference. Since 2017 algif_aead runs in place (src = dst), so authencesn's scratch write past the tag lands on that cached page, at an offset and value the caller picks. The file on disk is never written. The fix goes back to out of place, so the scratch write lands in the caller's buffer.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };

function iso([x, y, z], projection) {
    const { origin } = projection;

    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}

const tenth = (value) => {

}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));

        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];

// Shared live runtime, inlined into every figure page after the kit.
// A figure is a pure function of cycle time t and one boolean: the bug (false) or the fix (true).
// This drives the idle tour (alternating bug and fix), hover scrubbing, arrow-key steps,
// the fix toggle, the offscreen pause and reduced motion, and writes the readout.
function runFigure({ cycle, scrubEnd, steps, draw, phase, label }) {
  const stage = document.querySelector(".iso-stage");
  const svg = stage.querySelector("svg");
  const readout = document.querySelector("[data-readout]");
  const live = document.querySelector("[data-live]");
  const button = document.querySelector("[data-fix]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const settledAt = steps[steps.length - 1];

  let fixed = false,
    t = 0,
    goal = 0,
    touring = !still.matches,
    visible = false,
    frame = 0,
    last = 0,
    idle = 0,
    said = "";
  if (still.matches) t = goal = settledAt;

  const say = (text, announce) => {
    if (readout.textContent !== text) readout.textContent = text;
    if (announce && live.textContent !== text) live.textContent = text;
  };
  const sync = () => {
    button.setAttribute("aria-pressed", String(fixed));
    button.textContent = label(fixed);
  };
  const render = () => {
    draw(t, fixed);
    const text = phase(t, fixed);
    if (text !== said) {
      said = text;
      say(text, !touring);
    }
  };

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    if (touring) {
      goal += dt;
      if (goal >= cycle) {
        goal -= cycle;
        fixed = !fixed;
        sync();
      }
      t = goal;
    } else {
      t = still.matches ? goal : t + (goal - t) * (1 - Math.exp(-dt / 0.25));
      if (Math.abs(goal - t) < 0.002) t = goal;
    }
    render();
    frame =
      visible && (touring || t !== goal) ? requestAnimationFrame(tick) : 0;
  }
  const run = () => {
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };

  // Any input stops the tour where it is; it resumes 3.6 s after the last one
  function takeOver() {
    touring = false;
    clearTimeout(idle);
    if (!still.matches)
      idle = setTimeout(() => {
        touring = true;
        goal = t;
        run();
      }, 3600);
  }

  button.addEventListener("click", () => {
    fixed = !fixed;
    sync();
    clearTimeout(idle);
    // Replay from the start so the reader watches the whole run in the new mode
    if (still.matches) {
      t = goal = settledAt;
      render();
      return;
    }
    touring = true;
    t = goal = 0;
    render();
    run();
  });

  stage.addEventListener("pointermove", (event) => {
    if (event.pointerType !== "mouse") return;
    const box = svg.getBoundingClientRect();
    const share = Math.min(
      1,
      Math.max(0, ((event.clientX - box.left) / box.width - 0.12) / 0.76),
    );
    takeOver();
    goal = share * scrubEnd;
    run();
  });

  stage.addEventListener("keydown", (event) => {
    if (event.key === " " || event.key === "Enter") {
      event.preventDefault();
      button.click();
      return;
    }
    const here = steps.reduce(
      (best, s, i) =>
        Math.abs(s - goal) < Math.abs(steps[best] - goal) ? i : best,
      0,
    );
    let next = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp")
      next = steps[Math.min(steps.length - 1, here + 1)];
    if (event.key === "ArrowLeft" || event.key === "ArrowDown")
      next = steps[Math.max(0, here - 1)];
    if (event.key === "Home") next = steps[0];
    if (event.key === "End") next = settledAt;
    if (next === null) return;
    event.preventDefault();
    takeOver();
    goal = next;
    run();
  });
  stage.addEventListener("focus", () => say(said, true));

  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    touring = !still.matches;
    if (still.matches) t = goal = settledAt;
    render();
    run();
  });
  sync();
  render();
}

// Smoothstep from a to b; the easing every figure uses for scripted moves
function ease(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

const P = {"origin":[300,207.9247422419326],"scale":1.0847525701009832,"azimuth":45,"elevation":30};
const CARRIAGE = {"home":10,"page":-43.4,"tray":-2}, PROBE = {"rest":48,"read":38}, STOP_Y = -7;
const T = { alg: [0.2, 0.5], splice: [0.8, 1.4], out: [1.8, 3.4], stamp: [3.45, 3.65, 3.9], back: [4.0, 5.0], exec: [5.3, 5.7, 6.4], reset: 8.4, cycle: 10 };

const svg = document.querySelector(".iso-stage svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const carriage = part("carriage"), probe = part("probe"), splice = part("splice"), fix = part("fix");
const bytes = { page: part("bytes-page"), tray: part("bytes-tray") };
const lamps = { alg: part("lamp-alg"), root: part("lamp-root") };

function phaseOf(t, fixed) {
  if (t >= T.reset) return "resetting";
  if (t < T.splice[0]) return "socket(AF_ALG) · authencesn";
  if (t < T.out[0]) return "splice /usr/bin/su · by reference";
  if (t < T.stamp[0]) return fixed ? "out of place · dst = your buffer" : "in place · src = dst";
  if (t < T.exec[0]) return fixed ? "4 bytes past the tag · your buffer" : "4 bytes past the tag · cached page";
  return fixed ? "execve su · unchanged" : "execve su · root · disk untouched";
}

runFigure({
  cycle: T.cycle,
  scrubEnd: 8.2,
  steps: [0.2, T.splice[1], T.out[1], T.stamp[2], T.exec[2] + 0.3],
  label: (fixed) => (fixed ? "Fixed: out-of-place again" : "Apply the fix: separate dst"),
  phase: phaseOf,
  draw(t, fixed) {
    const back = 1 - ease(T.reset, T.reset + 0.6, t);
    lamps.alg.style.opacity = (ease(...T.alg, t) * back).toFixed(3);
    splice.style.opacity = (ease(...T.splice, t) * back).toFixed(3);
    fix.style.opacity = fixed ? "1" : "0";
    const target = fixed ? CARRIAGE.tray : CARRIAGE.page;
    const y = CARRIAGE.home + (target - CARRIAGE.home) * ease(...T.out, t) * (1 - ease(...T.back, t));
    // The stylus dips to strike: a small nod down and back
    const strike = ease(T.stamp[0], T.stamp[1], t) * (1 - ease(T.stamp[1], T.stamp[2], t));
    carriage.setAttribute("transform", translateAlong(P, [0, y, -0.8 * strike]));
    const marked = ease(T.stamp[1] - 0.02, T.stamp[1] + 0.08, t) * back;
    bytes.page.style.opacity = (fixed ? 0 : marked).toFixed(3);
    bytes.tray.style.opacity = (fixed ? marked : 0).toFixed(3);
    const read = ease(T.exec[0], T.exec[1], t) * (1 - ease(T.exec[1] + 0.2, T.exec[2], t));
    probe.setAttribute("transform", translateAlong(P, [0, 0, PROBE.rest + (PROBE.read - PROBE.rest) * read]));
    lamps.root.style.opacity = (fixed ? 0 : ease(T.exec[1], T.exec[1] + 0.15, t) * back).toFixed(3);
  },
});

new ResizeObserver(() => parent.postMessage({ figure: "copy-fail-732-bytes-to-root", height: Math.ceil(document.body.getBoundingClientRect().height) }, "/")).observe(document.body);
</script></body></html>
