@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;
// Shared live runtime, inlined into every figure page after the kit.
// A figure is a pure function of cycle time t and one boolean: the bug (false) or the fix (true).
// This drives the idle tour (alternating bug and fix), hover scrubbing, arrow-key steps,
// the fix toggle, the offscreen pause and reduced motion, and writes the readout.
function runFigure({ cycle, scrubEnd, steps, draw, phase, label, scrub = true }) {
  const stage = document.querySelector(".iso-stage");
  const svg = stage.querySelector("svg");
  const readout = document.querySelector("[data-readout]");
  const live = document.querySelector("[data-live]");
  const button = document.querySelector("[data-fix]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const settledAt = steps[steps.length - 1];

  let fixed = false,
    t = 0,
    goal = 0,
    touring = !still.matches,
    visible = false,
    frame = 0,
    last = 0,
    idle = 0,
    said = "";
  if (still.matches) t = goal = settledAt;

  const say = (text, announce) => {
    if (readout.textContent !== text) readout.textContent = text;
    if (announce && live.textContent !== text) live.textContent = text;
  };
  // A figure without a documented fix has no toggle; its tour just loops the bug
  const sync = () => {
    if (!button) return;
    button.setAttribute("aria-pressed", String(fixed));
    button.textContent = label(fixed);
  };
  const render = () => {
    draw(t, fixed);
    const text = phase(t, fixed);
    if (text !== said) {
      said = text;
      say(text, !touring);
    }
  };

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    if (touring) {
      goal += dt;
      if (goal >= cycle) {
        goal -= cycle;
        if (button) {
          fixed = !fixed;
          sync();
        }
      }
      t = goal;
    } else {
      t = still.matches ? goal : t + (goal - t) * (1 - Math.exp(-dt / 0.25));
      if (Math.abs(goal - t) < 0.002) t = goal;
    }
    render();
    frame =
      visible && (touring || t !== goal) ? requestAnimationFrame(tick) : 0;
  }
  const run = () => {
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };

  // Any input stops the tour where it is; it resumes 3.6 s after the last one
  function takeOver() {
    touring = false;
    clearTimeout(idle);
    if (!still.matches)
      idle = setTimeout(() => {
        touring = true;
        goal = t;
        run();
      }, 3600);
  }

  button?.addEventListener("click", () => {
    fixed = !fixed;
    sync();
    clearTimeout(idle);
    // Replay from the start so the reader watches the whole run in the new mode
    if (still.matches) {
      t = goal = settledAt;
      render();
      return;
    }
    touring = true;
    t = goal = 0;
    render();
    run();
  });

  stage.addEventListener("pointermove", (event) => {
    if (!scrub || event.pointerType !== "mouse") return;
    const box = svg.getBoundingClientRect();
    const share = Math.min(
      1,
      Math.max(0, ((event.clientX - box.left) / box.width - 0.12) / 0.76),
    );
    takeOver();
    goal = share * scrubEnd;
    run();
  });

  stage.addEventListener("keydown", (event) => {
    if (button && (event.key === " " || event.key === "Enter")) {
      event.preventDefault();
      button.click();
      return;
    }
    const here = steps.reduce(
      (best, s, i) =>
        Math.abs(s - goal) < Math.abs(steps[best] - goal) ? i : best,
      0,
    );
    let next = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp")
      next = steps[Math.min(steps.length - 1, here + 1)];
    if (event.key === "ArrowLeft" || event.key === "ArrowDown")
      next = steps[Math.max(0, here - 1)];
    if (event.key === "Home") next = steps[0];
    if (event.key === "End") next = settledAt;
    if (next === null) return;
    event.preventDefault();
    takeOver();
    goal = next;
    run();
  });
  stage.addEventListener("focus", () => say(said, true));

  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    touring = !still.matches;
    if (still.matches) t = goal = settledAt;
    render();
    run();
  });
  sync();
  render();
}

// Smoothstep from a to b; the easing every figure uses for scripted moves
function ease(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

const P = {"origin":[300,234.2543504834373],"scale":1.3306298193238728,"azimuth":45,"elevation":30};
const MAIN_Y = 10, BYPASS_Y = 38, BED_H = 6, RAM = {"rest":30,"down":14.6};
const X = { start: -112, gate: -50, press: -10, store: 72, split: -82, lane: -72, join: 50, rejoin: 60, trap: -64 };
const YOURS = 1;
const T = {
  c1: { toPress: [0.2, 2.2], press: [2.3, 2.6, 2.95], toStore: [3.0, 4.4], open: [4.6, 5.2] },
  c2: { in: [5.4, 6.0], split: [6.0, 6.5], lane: [6.5, 7.9], rejoin: [7.9, 8.4], toStore: [8.4, 8.8], open: [8.9, 9.6], toBin: [6.5, 7.0], drop: [7.0, 7.4] },
  reset: 10.6, cycle: 12,
};

const svg = document.querySelector(".iso-stage svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const crate1 = part("crate1"), crate2 = part("crate2"), sealBands = part("seal"), ramPart = part("ram"), fix = part("fix");
const slots = { bypass: svg.querySelector('[data-slot="bypass"]'), main: svg.querySelector('[data-slot="main"]') };
const drawers = [0, 1, 2].map((i) => part("drawer-" + i));
const lamps = { store: part("lamp-store"), reject: part("lamp-reject") };
const lerp = (a, b, u) => a + (b - a) * u;

// Crate 2 is drawn in front of the station frames while it rides the bypass lane, between their posts on the main belt
function slot(y) {
  const target = y > (MAIN_Y + BYPASS_Y) / 2 ? slots.bypass : slots.main;
  if (crate2.parentNode !== target) target.appendChild(crate2);
}

function crate1At(t) {
  const c = T.c1;
  let x = lerp(X.start, X.press, ease(...c.toPress, t));
  x = lerp(x, X.store, ease(...c.toStore, t));
  return [x, MAIN_Y, BED_H];
}

function crate2At(t, fixed) {
  const c = T.c2;
  let x = lerp(X.start, X.split, ease(...c.in, t));
  let y = MAIN_Y, z = BED_H;
  const s = ease(...c.split, t);
  x = lerp(x, X.lane, s); y = lerp(MAIN_Y, BYPASS_Y, s);
  if (fixed) {
    x = lerp(x, X.trap, ease(...c.toBin, t));
    z = BED_H - 10 * ease(...c.drop, t);
    return [x, y, z];
  }
  x = lerp(x, X.join, ease(...c.lane, t));
  const r = ease(...c.rejoin, t);
  x = lerp(x, X.rejoin, r); y = lerp(y, MAIN_Y, r);
  x = lerp(x, X.store, ease(...c.toStore, t));
  return [x, y, z];
}

function phaseOf(t, fixed) {
  const c1 = T.c1, c2 = T.c2;
  if (t >= T.reset) return "resetting";
  if (t < 1.2) return "FROM trigger_dev.task_runs_v2";
  if (t < c1.press[0]) return "allowlist · known table";
  if (t < c1.open[0]) return "tenant filter · 3 columns";
  if (t < c2.in[0]) return "rows · your environment only";
  if (t < c2.split[1]) return "FROM {trigger_dev.task_runs_v2}";
  if (fixed) return "QueryError · placeholder rejected";
  if (t < c2.open[0]) return "placeholder · no lookup, no filter";
  return "rows · every tenant";
}

runFigure({
  cycle: T.cycle,
  scrubEnd: 10.4,
  steps: [0.2, T.c1.press[2], T.c1.open[1], T.c2.split[1], T.c2.rejoin[1], T.c2.open[1] + 0.3],
  label: (fixed) => (fixed ? "Fixed: placeholders rejected" : "Apply the fix: reject placeholders"),
  phase: phaseOf,
  draw(t, fixed) {
    const c1 = T.c1, c2 = T.c2;
    const back = 1 - ease(T.reset, T.reset + 0.6, t);
    crate1.setAttribute("transform", translateAlong(P, crate1At(t)));
    crate1.style.opacity = (ease(0, 0.3, t) * (1 - ease(c1.toStore[1] - 0.3, c1.toStore[1], t))).toFixed(3);
    sealBands.style.opacity = ease(c1.press[1] - 0.05, c1.press[1] + 0.1, t).toFixed(3);
    const pressed = ease(c1.press[0], c1.press[1], t) * (1 - ease(c1.press[1] + 0.05, c1.press[2], t));
    ramPart.setAttribute("transform", translateAlong(P, [0, 0, lerp(RAM.rest, RAM.down, pressed)]));

    const at2 = crate2At(t, fixed);
    slot(at2[1]);
    crate2.setAttribute("transform", translateAlong(P, at2));
    const gone = fixed ? ease(c2.drop[0] + 0.1, c2.drop[1], t) : ease(c2.toStore[1] - 0.25, c2.toStore[1], t);
    crate2.style.opacity = (ease(c2.in[0], c2.in[0] + 0.3, t) * (1 - gone)).toFixed(3);

    fix.style.opacity = fixed ? "1" : "0";
    lamps.reject.style.opacity = (fixed ? ease(c2.drop[1], c2.drop[1] + 0.15, t) * back : 0).toFixed(3);
    // Your drawer for the sealed crate; every drawer for the unsealed one
    const mine = ease(...c1.open, t) * (1 - ease(c2.in[0], c2.in[0] + 0.5, t));
    const all = fixed ? 0 : ease(...c2.open, t) * back;
    drawers.forEach((d, i) => {
      const out = Math.max(i === YOURS ? mine : 0, all);
      d.setAttribute("transform", translateAlong(P, [0, 10 * out, 0]));
    });
    lamps.store.style.opacity = Math.max(mine, all).toFixed(3);
  },
});

const reportHeight = () => parent.postMessage({ figure: "trigger-dev-tsql-placeholder-tenant-bypass", height: Math.ceil(document.body.getBoundingClientRect().height) }, "/");
new ResizeObserver(reportHeight).observe(document.body);
addEventListener("message", (e) => { if (e.origin === location.origin && e.data === "figure:measure") reportHeight(); });
</script></body></html>
