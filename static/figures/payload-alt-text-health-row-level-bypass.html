.iso{

  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;

  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}

.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}

.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}

.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}

.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}

.iso-dots[data-tone="lo"] circle{opacity:.22}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}

.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}

.iso-plate .iso-svg{margin:0 auto}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}

*{box-sizing:border-box}

.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

html{color-scheme:light dark}
html,body{background:transparent}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.iso-page{width:100%;margin:0}
.iso-figure{margin:0}

.fig-controls{display:flex;gap:8px;margin-top:12px}
.fig-controls button{font:inherit;font-size:12px;color:var(--anatomy-strong);background:var(--anatomy-card);border:1px solid var(--anatomy-mid);padding:6px 12px;cursor:pointer;transition:transform 100ms ease-out}

.fig-controls button:active{transform:scale(.97)}
.fig-controls button:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
@media (max-width:420px){.iso-plate{overflow:hidden}.iso-stage svg{width:118%;margin:0 -9%}}
.fig-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

.iso{--db-hazard:#3a3a3e;--db-well:#e9e9e6;--db-flap:#2a2a2e;--db-flap-text:#f4f4f1}

.db-lamp-on .iso-top,.db-lamp-on .iso-shade,.db-lamp-on .iso-fill{fill:var(--anatomy-hi)}

// Shared live runtime, inlined into every figure page after the kit.
// A figure is a pure function of cycle time t and one boolean: the bug (false) or the fix (true).
// This drives the idle tour (alternating bug and fix), hover scrubbing, arrow-key steps,
// the fix toggle, the offscreen pause and reduced motion, and writes the readout.
function runFigure({ cycle, scrubEnd, steps, draw, phase, label }) {
  const stage = document.querySelector(".iso-stage");
  const svg = stage.querySelector("svg");
  const readout = document.querySelector("[data-readout]");
  const live = document.querySelector("[data-live]");
  const button = document.querySelector("[data-fix]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const settledAt = steps[steps.length - 1];

  let fixed = false,
    t = 0,
    goal = 0,
    touring = !still.matches,
    visible = false,
    frame = 0,
    last = 0,
    idle = 0,
    said = "";
  if (still.matches) t = goal = settledAt;

  const say = (text, announce) => {
    if (readout.textContent !== text) readout.textContent = text;
    if (announce && live.textContent !== text) live.textContent = text;
  };
  const sync = () => {
    button.setAttribute("aria-pressed", String(fixed));
    button.textContent = label(fixed);
  };
  const render = () => {
    draw(t, fixed);
    const text = phase(t, fixed);
    if (text !== said) {
      said = text;
      say(text, !touring);
    }
  };

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    if (touring) {
      goal += dt;
      if (goal >= cycle) {
        goal -= cycle;
        fixed = !fixed;
        sync();
      }
      t = goal;
    } else {
      t = still.matches ? goal : t + (goal - t) * (1 - Math.exp(-dt / 0.25));
      if (Math.abs(goal - t) < 0.002) t = goal;
    }
    render();
    frame =
      visible && (touring || t !== goal) ? requestAnimationFrame(tick) : 0;
  }
  const run = () => {
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };

  // Any input stops the tour where it is; it resumes 3.6 s after the last one
  function takeOver() {
    touring = false;
    clearTimeout(idle);
    if (!still.matches)
      idle = setTimeout(() => {
        touring = true;
        goal = t;
        run();
      }, 3600);
  }

  button.addEventListener("click", () => {
    fixed = !fixed;
    sync();
    clearTimeout(idle);
    // Replay from the start so the reader watches the whole run in the new mode
    if (still.matches) {
      t = goal = settledAt;
      render();
      return;
    }
    touring = true;
    t = goal = 0;
    render();
    run();
  });

  stage.addEventListener("pointermove", (event) => {
    if (event.pointerType !== "mouse") return;
    const box = svg.getBoundingClientRect();
    const share = Math.min(
      1,
      Math.max(0, ((event.clientX - box.left) / box.width - 0.12) / 0.76),
    );
    takeOver();
    goal = share * scrubEnd;
    run();
  });

  stage.addEventListener("keydown", (event) => {
    if (event.key === " " || event.key === "Enter") {
      event.preventDefault();
      button.click();
      return;
    }
    const here = steps.reduce(
      (best, s, i) =>
        Math.abs(s - goal) < Math.abs(steps[best] - goal) ? i : best,
      0,
    );
    let next = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp")
      next = steps[Math.min(steps.length - 1, here + 1)];
    if (event.key === "ArrowLeft" || event.key === "ArrowDown")
      next = steps[Math.max(0, here - 1)];
    if (event.key === "Home") next = steps[0];
    if (event.key === "End") next = settledAt;
    if (next === null) return;
    event.preventDefault();
    takeOver();
    goal = next;
    run();
  });
  stage.addEventListener("focus", () => say(said, true));

  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    touring = !still.matches;
    if (still.matches) t = goal = settledAt;
    render();
    run();
  });
  sync();
  render();
}

// Smoothstep from a to b; the easing every figure uses for scripted moves
function ease(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

const P = {"origin":[300,207.9247422419326],"scale":1.0847525701009832,"azimuth":45,"elevation":30};
const SWEEP = [-74,62], COLUMNS = [{"x":-55,"theirs":false},{"x":-43,"theirs":false},{"x":-31,"theirs":false},{"x":-19,"theirs":false},{"x":11,"theirs":true},{"x":23,"theirs":true},{"x":35,"theirs":true},{"x":47,"theirs":true}], ROWS = 3, SAMPLE = {"totalDocs":460,"missingDocs":37,"partialDocs":11,"completeDocs":412};
const SLOT = [-114,-43], TRAY = {"x":-122,"y":-30,"w":22,"d":12,"r":1.2}, SHUTTER_TRAVEL = 54;
const GAUGE = {"x":-124,"y":-52,"w":28,"d":18,"r":2}, GAUGE_TOP = 12, DIAL = [96,-40], DIAL_R = 13, DIAL_TOP = 12;
const T = { card: [0.4, 1.2], gauge: [1.5, 1.9], discard: [2.1, 2.8], shutter: [2.1, 2.9], sweep: [3.1, 7.1], reset: 8.6, home: [8.6, 9.8], cycle: 10 };
const pointerD = (u) => {
  const pivot = [GAUGE.x + GAUGE.w - 14, GAUGE.y + GAUGE.d / 2];
  const a = Math.PI / 2 + (u * 2 - 1) * 0.62;
  return lineOnTop(pivot, [pivot[0] + Math.sin(a) * 7.6, pivot[1] - Math.cos(a) * 7.6 * 0.8], GAUGE_TOP + 1.6, P);
};
const needleD = (share) => {
  const a = ((-150 + 300 * share) * Math.PI) / 180;
  const [x, y] = DIAL;
  return lineOnTop([x - Math.sin(a) * 2.4, y + Math.cos(a) * 2.4], [x + Math.sin(a) * (DIAL_R - 3.2), y - Math.cos(a) * (DIAL_R - 3.2)], DIAL_TOP + 0.2, P);
};

const svg = document.querySelector(".iso-stage svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const card = part("card"), pointer = part("pointer"), needle = part("needle"), shutterPart = part("shutter"), yes = part("lamp-yes");
const bridges = [part("bridge-back"), part("bridge")];
const total = COLUMNS.length * ROWS;

function counted(x, fixed) {
  let n = 0;
  for (const col of COLUMNS) if (x >= col.x && !(fixed && col.theirs)) n += ROWS;
  return n;
}

function phaseOf(t, fixed) {
  if (t >= T.reset) return "resetting";
  if (t < T.gauge[0]) return "GET /api/alt-text/health";
  if (t < T.discard[0]) return "read → Where { tenant }";
  if (t < T.sweep[0]) return fixed ? "Where kept · scan as the user" : "Where !== false → true";
  if (t < T.sweep[1]) return fixed ? "scanning · overrideAccess: false" : "scanning · overrideAccess: true";
  return fixed ? "counts · your tenant's rows only" : SAMPLE.totalDocs + " docs · " + SAMPLE.missingDocs + " missing · all tenants";
}

runFigure({
  cycle: T.cycle,
  scrubEnd: 8.4,
  steps: [0.2, T.gauge[1], T.discard[1], (T.sweep[0] + T.sweep[1]) / 2, T.sweep[1] + 0.4],
  label: (fixed) => (fixed ? "Fixed: the Where is applied" : "Apply the fix: keep the Where"),
  phase: phaseOf,
  draw(t, fixed) {
    const back = 1 - ease(T.reset, T.reset + 0.6, t);
    const x = t < T.home[0] ? SWEEP[0] + (SWEEP[1] - SWEEP[0]) * ease(...T.sweep, t) : SWEEP[1] + (SWEEP[0] - SWEEP[1]) * ease(...T.home, t);
    for (const b of bridges) b.setAttribute("transform", translateAlong(P, [x, 0, 0]));
    // The card drops into the slot; in the bug it then goes to the discard tray
    const seat = ease(...T.card, t);
    let pos = [0, 0, 14 * (1 - seat)];
    if (!fixed) {
      const d = ease(...T.discard, t);
      const lift = Math.sin(Math.PI * d) * 10;
      pos = [(TRAY.x + TRAY.w / 2 - SLOT[0]) * d, (TRAY.y + TRAY.d / 2 - SLOT[1]) * d, pos[2] + lift + (4 - GAUGE_TOP) * d];
    }
    card.setAttribute("transform", translateAlong(P, [pos[0], pos[1], GAUGE_TOP + pos[2]]));
    card.style.opacity = (ease(T.card[0], T.card[0] + 0.25, t) * back).toFixed(3);
    const tilt = ease(...T.gauge, t) * back;
    pointer.setAttribute("d", pointerD(tilt));
    yes.style.opacity = tilt.toFixed(3);
    shutterPart.setAttribute("transform", translateAlong(P, [0, fixed ? SHUTTER_TRAVEL * ease(...T.shutter, t) * back : 0, 0]));
    const n = t < T.sweep[0] || t >= T.reset ? 0 : counted(x + 0.001, fixed);
    needle.setAttribute("d", needleD(n / total));
  },
});

new ResizeObserver(() => parent.postMessage({ figure: "payload-alt-text-health-row-level-bypass", height: Math.ceil(document.body.getBoundingClientRect().height) }, "/")).observe(document.body);
