butes to the class, so one bar covers every action.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;

}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));

        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];
    for (const [cx, cy, start] of corners) {

function signedArea(points) {

// Shared live runtime, inlined into every figure page after the kit.
// A figure is a pure function of cycle time t and one boolean: the bug (false) or the fix (true).
// This drives the idle tour (alternating bug and fix), hover scrubbing, arrow-key steps,
// the fix toggle, the offscreen pause and reduced motion, and writes the readout.
function runFigure({ cycle, scrubEnd, steps, draw, phase, label, scrub = true }) {
  const stage = document.querySelector(".iso-stage");
  const svg = stage.querySelector("svg");
  const readout = document.querySelector("[data-readout]");
  const live = document.querySelector("[data-live]");
  const button = document.querySelector("[data-fix]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const settledAt = steps[steps.length - 1];

  let fixed = false,
    t = 0,
    goal = 0,
    touring = !still.matches,
    visible = false,
    frame = 0,
    last = 0,
    idle = 0,
    said = "";
  if (still.matches) t = goal = settledAt;

  const say = (text, announce) => {
    if (readout.textContent !== text) readout.textContent = text;
    if (announce && live.textContent !== text) live.textContent = text;
  };
  // A figure without a documented fix has no toggle; its tour just loops the bug
  const sync = () => {
    if (!button) return;
    button.setAttribute("aria-pressed", String(fixed));
    button.textContent = label(fixed);
  };
  const render = () => {
    draw(t, fixed);
    const text = phase(t, fixed);
    if (text !== said) {
      said = text;
      say(text, !touring);
    }
  };

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    if (touring) {
      goal += dt;
      if (goal >= cycle) {
        goal -= cycle;
        if (button) {
          fixed = !fixed;
          sync();
        }
      }
      t = goal;
    } else {
      t = still.matches ? goal : t + (goal - t) * (1 - Math.exp(-dt / 0.25));
      if (Math.abs(goal - t) < 0.002) t = goal;
    }
    render();
    frame =
      visible && (touring || t !== goal) ? requestAnimationFrame(tick) : 0;
  }
  const run = () => {
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };

  // Any input stops the tour where it is; it resumes 3.6 s after the last one
  function takeOver() {
    touring = false;
    clearTimeout(idle);
    if (!still.matches)
      idle = setTimeout(() => {
        touring = true;
        goal = t;
        run();
      }, 3600);
  }

  button?.addEventListener("click", () => {
    fixed = !fixed;
    sync();
    clearTimeout(idle);
    // Replay from the start so the reader watches the whole run in the new mode
    if (still.matches) {
      t = goal = settledAt;
      render();
      return;
    }
    touring = true;
    t = goal = 0;
    render();
    run();
  });

  stage.addEventListener("pointermove", (event) => {
    if (!scrub || event.pointerType !== "mouse") return;
    const box = svg.getBoundingClientRect();
    const share = Math.min(
      1,
      Math.max(0, ((event.clientX - box.left) / box.width - 0.12) / 0.76),
    );
    takeOver();
    goal = share * scrubEnd;
    run();
  });

  stage.addEventListener("keydown", (event) => {
    if (button && (event.key === " " || event.key === "Enter")) {
      event.preventDefault();
      button.click();
      return;
    }
    const here = steps.reduce(
      (best, s, i) =>
        Math.abs(s - goal) < Math.abs(steps[best] - goal) ? i : best,
      0,
    );
    let next = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp")
      next = steps[Math.min(steps.length - 1, here + 1)];
    if (event.key === "ArrowLeft" || event.key === "ArrowDown")
      next = steps[Math.max(0, here - 1)];
    if (event.key === "Home") next = steps[0];
    if (event.key === "End") next = settledAt;
    if (next === null) return;
    event.preventDefault();
    takeOver();
    goal = next;
    run();
  });
  stage.addEventListener("focus", () => say(said, true));

  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    touring = !still.matches;
    if (still.matches) t = goal = settledAt;
    render();
    run();
  });
  sync();
  render();
}

// Smoothstep from a to b; the easing every figure uses for scripted moves
function ease(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

const P = {"origin":[300,234.2543504834373],"scale":1.3306298193238728,"azimuth":45,"elevation":30};
const STOPS = {"start":-95,"report":-68,"export":33};
const EXPORT_W = 44;
const CRATE_FROM = [33, -22, 6], CRATE_TO = [33, -2, 9];
const T = { toReport: [0.3, 1.4], tryReport: [1.6, 2.6], toExport: [2.8, 4.0], tryExport: [4.2, 5.0], crate: [5.0, 6.0], reset: 8.4, home: [8.6, 9.8], cycle: 10 };

const svg = document.querySelector(".iso-stage svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const cart = part("cart"), crate = part("crate"), bar = part("bar");
const doors = { report: part("door-report"), export: part("door-export") };
const lamps = { report: part("lamp-report"), cls: part("lamp-class") };

// A refused door rattles against its bolt and settles; it never opens
const rattle = (t, [a, b]) => (t > a && t < b ? 0.7 * Math.sin((t - a) * 2 * Math.PI * 9) * (1 - ease(a, b, t)) : 0);

function phaseOf(t, fixed) {
  if (t < T.tryReport[0]) return "ROLE_USER · logged in";
  if (t < T.tryExport[0]) return "GET /reporting/project_view · 403";
  if (t >= T.reset) return "resetting";
  if (fixed) return "GET …/project_view/export · 403";
  return t < T.crate[1] ? "GET …/project_view/export · 200" : "export · 200 · every customer's projects";
}

runFigure({
  cycle: T.cycle,
  scrubEnd: 8.2,
  steps: [0.2, T.tryReport[1], T.toExport[1], T.tryExport[1], T.crate[1] + 0.4],
  label: (fixed) => (fixed ? "Fixed: guards on the class" : "Apply the fix: guard the class"),
  phase: phaseOf,
  draw(t, fixed) {
    const back = 1 - ease(T.reset, T.reset + 0.6, t);
    const x = t < T.home[0]
      ? STOPS.start + (STOPS.report - STOPS.start) * ease(...T.toReport, t) + (STOPS.export - STOPS.report) * ease(...T.toExport, t)
      : STOPS.export + (STOPS.start - STOPS.export) * ease(...T.home, t);
    cart.setAttribute("transform", translateAlong(P, [x, 0, 0]));
    doors.report.setAttribute("transform", translateAlong(P, [rattle(t, T.tryReport), 0, 0]));
    lamps.report.style.opacity = (ease(T.tryReport[0], T.tryReport[0] + 0.15, t) * (1 - ease(T.tryReport[1], T.tryReport[1] + 0.3, t))).toFixed(3);
    bar.style.opacity = fixed ? "1" : "0";
    if (fixed) {
      doors.export.setAttribute("transform", translateAlong(P, [rattle(t, T.tryExport), 0, 0]));
      lamps.cls.style.opacity = (ease(T.tryExport[0], T.tryExport[0] + 0.15, t) * back).toFixed(3);
      crate.style.opacity = "0";
      return;
    }
    lamps.cls.style.opacity = "0";
    doors.export.setAttribute("transform", translateAlong(P, [EXPORT_W * ease(...T.tryExport, t) * back, 0, 0]));
    // The crate comes out of the hold onto the cart, then rides home with it
    const out = ease(...T.crate, t);
    const at = t < T.home[0]
      ? CRATE_FROM.map((v, i) => v + (CRATE_TO[i] - v) * out)
      : [x, CRATE_TO[1], CRATE_TO[2]];
    crate.setAttribute("transform", translateAlong(P, at));
    crate.style.opacity = (ease(T.crate[0], T.crate[0] + 0.25, t) * back).toFixed(3);
  },
});

const fitFrame = () => { if (window.frameElement) window.frameElement.style.height = Math.ceil(document.body.getBoundingClientRect().height) + "px"; };
new ResizeObserver(fitFrame).observe(document.body);
fitFrame();
</script></body></html>
