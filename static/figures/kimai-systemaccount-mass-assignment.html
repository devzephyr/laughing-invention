const ELEVATION = 30;

const RADIANS = Math.PI / 180;

function roundedPlan({ x, y, w, d, r }, steps = 8) {

        [x + radius, y + radius, 180],

    const out = [];

function signedArea(points) {

// Shared live runtime, inlined into every figure page after the kit.
// A figure is a pure function of cycle time t and one boolean: the bug (false) or the fix (true).
// This drives the idle tour (alternating bug and fix), hover scrubbing, arrow-key steps,
// the fix toggle, the offscreen pause and reduced motion, and writes the readout.
function runFigure({ cycle, scrubEnd, steps, draw, phase, label, scrub = true }) {
  const stage = document.querySelector(".iso-stage");
  const svg = stage.querySelector("svg");
  const readout = document.querySelector("[data-readout]");
  const live = document.querySelector("[data-live]");
  const button = document.querySelector("[data-fix]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const settledAt = steps[steps.length - 1];

  let fixed = false,
    t = 0,
    goal = 0,
    touring = !still.matches,
    visible = false,
    frame = 0,
    last = 0,
    idle = 0,
    said = "";
  if (still.matches) t = goal = settledAt;

  const say = (text, announce) => {
    if (readout.textContent !== text) readout.textContent = text;
    if (announce && live.textContent !== text) live.textContent = text;
  };
  // A figure without a documented fix has no toggle; its tour just loops the bug
  const sync = () => {
    if (!button) return;
    button.setAttribute("aria-pressed", String(fixed));
    button.textContent = label(fixed);
  };
  const render = () => {
    draw(t, fixed);
    const text = phase(t, fixed);
    if (text !== said) {
      said = text;
      say(text, !touring);
    }
  };

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    if (touring) {
      goal += dt;
      if (goal >= cycle) {
        goal -= cycle;
        if (button) {
          fixed = !fixed;
          sync();
        }
      }
      t = goal;
    } else {
      t = still.matches ? goal : t + (goal - t) * (1 - Math.exp(-dt / 0.25));
      if (Math.abs(goal - t) < 0.002) t = goal;
    }
    render();
    frame =
      visible && (touring || t !== goal) ? requestAnimationFrame(tick) : 0;
  }
  const run = () => {
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };

  // Any input stops the tour where it is; it resumes 3.6 s after the last one
  function takeOver() {
    touring = false;
    clearTimeout(idle);
    if (!still.matches)
      idle = setTimeout(() => {
        touring = true;
        goal = t;
        run();
      }, 3600);
  }

  button?.addEventListener("click", () => {
    fixed = !fixed;
    sync();
    clearTimeout(idle);
    // Replay from the start so the reader watches the whole run in the new mode
    if (still.matches) {
      t = goal = settledAt;
      render();
      return;
    }
    touring = true;
    t = goal = 0;
    render();
    run();
  });

  stage.addEventListener("pointermove", (event) => {
    if (!scrub || event.pointerType !== "mouse") return;
    const box = svg.getBoundingClientRect();
    const share = Math.min(
      1,
      Math.max(0, ((event.clientX - box.left) / box.width - 0.12) / 0.76),
    );
    takeOver();
    goal = share * scrubEnd;
    run();
  });

  stage.addEventListener("keydown", (event) => {
    if (button && (event.key === " " || event.key === "Enter")) {
      event.preventDefault();
      button.click();
      return;
    }
    const here = steps.reduce(
      (best, s, i) =>
        Math.abs(s - goal) < Math.abs(steps[best] - goal) ? i : best,
      0,
    );
    let next = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp")
      next = steps[Math.min(steps.length - 1, here + 1)];
    if (event.key === "ArrowLeft" || event.key === "ArrowDown")
      next = steps[Math.max(0, here - 1)];
    if (event.key === "Home") next = steps[0];
    if (event.key === "End") next = settledAt;
    if (next === null) return;
    event.preventDefault();
    takeOver();
    goal = next;
    run();
  });
  stage.addEventListener("focus", () => say(said, true));

  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    touring = !still.matches;
    if (still.matches) t = goal = settledAt;
    render();
    run();
  });
  sync();
  render();
}

// Smoothstep from a to b; the easing every figure uses for scripted moves
function ease(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

const P = {"origin":[300,234.2543504834373],"scale":1.3306298193238728,"azimuth":45,"elevation":30};
const STOPS = {"start":-100,"first":-78,"last":42}, FINGER = {"rest":26,"onCover":22.8,"onLever":19}, REPORTS = 4;
const LEVER = {"base":14.6,"len":6.2,"tilt":28}, SWITCH_Y = -3, X6 = 42;
const T = { toFirst: [0.3, 1.3], pressFirst: [1.4, 1.8, 2.3], toLast: [2.6, 4.0], pressLast: [4.2, 4.6, 5.2], flip: [4.45, 4.75], drop: [5.3, 6.3], reset: 8.4, home: [8.6, 9.8], cycle: 10 };
const DROP = 22;

const svg = document.querySelector(".iso-stage svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const cart = part("cart"), finger = part("finger"), lever = part("lever").firstElementChild, cover6 = part("cover6"), saved = part("lamp-saved");
const tags = Array.from({ length: REPORTS }, (_, w) => part("you-" + w));
const leverD = (on) => {
  const a = ((on * 2 - 1) * LEVER.tilt * Math.PI) / 180;
  return segment([X6, SWITCH_Y, LEVER.base], [X6, SWITCH_Y + Math.sin(a) * LEVER.len, LEVER.base + Math.cos(a) * LEVER.len], P);
};
// Down, hold, up: the finger's travel during one press
const press = (t, [a, b, c]) => ease(a, b, t) * (1 - ease(b + 0.15, c, t));

function phaseOf(t, fixed) {
  if (t < T.pressFirst[0]) return "ROLE_TEAMLEAD · PATCH /api/users/4";
  if (t < T.toLast[0]) return "roles · guarded";
  if (t < T.pressLast[0]) return '{"systemAccount":true} · 22 bytes';
  if (t >= T.reset) return "resetting";
  if (fixed) return "systemAccount · admin only";
  return t < T.drop[0] ? "HTTP 200 · systemAccount true" : "user 4 · gone from 4 reports";
}

runFigure({
  cycle: T.cycle,
  scrubEnd: 8.2,
  steps: [0.2, T.pressFirst[1], T.toLast[1], T.pressLast[2], T.drop[1] + 0.3],
  label: (fixed) => (fixed ? "Fixed: systemAccount needs admin" : "Apply the fix: guard systemAccount"),
  phase: phaseOf,
  draw(t, fixed) {
    const x = t < T.home[0]
      ? STOPS.start + (STOPS.first - STOPS.start) * ease(...T.toFirst, t) + (STOPS.last - STOPS.first) * ease(...T.toLast, t)
      : STOPS.last + (STOPS.start - STOPS.last) * ease(...T.home, t);
    const back = 1 - ease(T.reset, T.reset + 0.6, t);
    // Covers stop the finger at their top; the bare lever lets it go further down
    const lastStop = fixed ? FINGER.onCover : FINGER.onLever;
    const z = FINGER.rest - (FINGER.rest - FINGER.onCover) * press(t, T.pressFirst) - (FINGER.rest - lastStop) * press(t, T.pressLast);
    cart.setAttribute("transform", translateAlong(P, [x, 0, 0]));
    finger.setAttribute("transform", translateAlong(P, [x, 0, z]));
    cover6.style.opacity = fixed ? "1" : "0";
    const on = fixed ? 0 : ease(...T.flip, t) * back;
    lever.setAttribute("d", leverD(on));
    saved.style.opacity = (fixed ? 0 : ease(T.flip[1], T.flip[1] + 0.15, t) * back).toFixed(3);
    tags.forEach((tag, w) => {
      const fall = fixed ? 0 : ease(T.drop[0] + w * 0.12, T.drop[0] + w * 0.12 + 0.7, t) * back;
      tag.setAttribute("transform", "translate(0 " + (fall * DROP).toFixed(2) + ")");
    });
  },
});

const fitFrame = () => { if (window.frameElement) window.frameElement.style.height = Math.ceil(document.body.getBoundingClientRect().height) + "px"; };
new ResizeObserver(fitFrame).observe(document.body);
fitFrame();
</script></body></html>
