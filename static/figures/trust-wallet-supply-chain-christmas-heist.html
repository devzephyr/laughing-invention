<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>One init option</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

html{color-scheme:light dark}
html,body{background:transparent}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.iso-page{width:100%;margin:0}
.iso-figure{margin:0}
.iso-stage{touch-action:pan-y}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.fig-controls{display:flex;gap:8px;margin-top:12px}
.fig-controls button{font:inherit;font-size:12px;color:var(--anatomy-strong);background:var(--anatomy-card);border:1px solid var(--anatomy-mid);padding:6px 12px;cursor:pointer;transition:transform 100ms ease-out}
.fig-controls button[aria-pressed="true"]{background:var(--anatomy-strong);color:var(--anatomy-card)}
.fig-controls button:active{transform:scale(.97)}
.fig-controls button:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
@media (max-width:420px){.iso-plate{overflow:hidden}.iso-stage svg{width:118%;margin:0 -9%}}
.fig-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

.iso{--db-hazard:#3a3a3e;--db-well:#e9e9e6;--db-flap:#2a2a2e;--db-flap-text:#f4f4f1}
.iso[data-theme="dark"]{--db-hazard:#4a4a4a;--db-well:#0e0e0e;--db-flap:#0b0b0b;--db-flap-text:#d8d8d8}
.db-hazard{fill:var(--db-hazard);stroke:none}
.db-well{fill:var(--db-well);stroke:none}
.db-lamp-on .iso-top,.db-lamp-on .iso-shade,.db-lamp-on .iso-fill{fill:var(--anatomy-hi)}

// Shared live runtime, inlined into every figure page after the kit.
// A figure is a pure function of cycle time t and one boolean: the bug (false) or the fix (true).
// This drives the idle tour (alternating bug and fix), hover scrubbing, arrow-key steps,
// the fix toggle, the offscreen pause and reduced motion, and writes the readout.
function runFigure({ cycle, scrubEnd, steps, draw, phase, label }) {
  const stage = document.querySelector(".iso-stage");
  const svg = stage.querySelector("svg");
  const readout = document.querySelector("[data-readout]");
  const live = document.querySelector("[data-live]");
  const button = document.querySelector("[data-fix]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const settledAt = steps[steps.length - 1];

  let fixed = false,
    t = 0,
    goal = 0,
    touring = !still.matches,
    visible = false,
    frame = 0,
    last = 0,
    idle = 0,
    said = "";
  if (still.matches) t = goal = settledAt;

  const say = (text, announce) => {
    if (readout.textContent !== text) readout.textContent = text;
    if (announce && live.textContent !== text) live.textContent = text;
  };
  const sync = () => {
    button.setAttribute("aria-pressed", String(fixed));
    button.textContent = label(fixed);
  };
  const render = () => {
    draw(t, fixed);
    const text = phase(t, fixed);
    if (text !== said) {
      said = text;
      say(text, !touring);
    }
  };

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    if (touring) {
      goal += dt;
      if (goal >= cycle) {
        goal -= cycle;
        fixed = !fixed;
        sync();
      }
      t = goal;
    } else {
      t = still.matches ? goal : t + (goal - t) * (1 - Math.exp(-dt / 0.25));
      if (Math.abs(goal - t) < 0.002) t = goal;
    }
    render();
    frame =
      visible && (touring || t !== goal) ? requestAnimationFrame(tick) : 0;
  }
  const run = () => {
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  };

  // Any input stops the tour where it is; it resumes 3.6 s after the last one
  function takeOver() {
    touring = false;
    clearTimeout(idle);
    if (!still.matches)
      idle = setTimeout(() => {
        touring = true;
        goal = t;
        run();
      }, 3600);
  }

  button.addEventListener("click", () => {
    fixed = !fixed;
    sync();
    clearTimeout(idle);
    // Replay from the start so the reader watches the whole run in the new mode
    if (still.matches) {
      t = goal = settledAt;
      render();
      return;
    }
    touring = true;
    t = goal = 0;
    render();
    run();
  });

  stage.addEventListener("pointermove", (event) => {
    if (event.pointerType !== "mouse") return;
    const box = svg.getBoundingClientRect();
    const share = Math.min(
      1,
      Math.max(0, ((event.clientX - box.left) / box.width - 0.12) / 0.76),
    );
    takeOver();
    goal = share * scrubEnd;
    run();
  });

  stage.addEventListener("keydown", (event) => {
    if (event.key === " " || event.key === "Enter") {
      event.preventDefault();
      button.click();
      return;
    }
    const here = steps.reduce(
      (best, s, i) =>
        Math.abs(s - goal) < Math.abs(steps[best] - goal) ? i : best,
      0,
    );
    let next = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp")
      next = steps[Math.min(steps.length - 1, here + 1)];
    if (event.key === "ArrowLeft" || event.key === "ArrowDown")
      next = steps[Math.max(0, here - 1)];
    if (event.key === "Home") next = steps[0];
    if (event.key === "End") next = settledAt;
    if (next === null) return;
    event.preventDefault();
    takeOver();
    goal = next;
    run();
  });
  stage.addEventListener("focus", () => say(said, true));

  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    touring = !still.matches;
    if (still.matches) t = goal = settledAt;
    render();
    run();
  });
  sync();
  render();
}

// Smoothstep from a to b; the easing every figure uses for scripted moves
function ease(a, b, x) {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
}

const P = {"origin":[300,207.9247422419326],"scale":1.0847525701009832,"azimuth":45,"elevation":30};
const PATH = {"start":-53,"turret":49,"back":-48,"front":24}, SEL = [64,-6], SEL_R = 9, SEL_TOP = 16, SAFE = {"x":-126,"y":-44,"w":40,"d":32,"r":2};
const SLIP_TO = [[53,10,-3.4000000000000004],[53,10,-13.4],[53,10,-23.4]];
const T = { unlock: [0.3, 0.9], drawers: [1.0, 1.6], seeds: [1.6, 2.4], pack: [2.5, 3.3], ride: [3.6, 5.0], fork: [5.2, 6.2], reset: 8.6, cycle: 10 };
const pointerD = (u) => {
  // u = 0 points at the PostHog port (back, -y); u = 1 at the other port (front, +y)
  const a = Math.PI * u;
  const [x, y] = SEL;
  return lineOnTop([x + Math.sin(a) * 1.6, y + Math.cos(a) * 1.6], [x - Math.sin(a) * (SEL_R - 3), y - Math.cos(a) * (SEL_R - 3)], SEL_TOP + 0.2, P);
};
const keyD = (u) => {
  const a = (u * Math.PI) / 2;
  const kx = SAFE.x + SAFE.w + 0.2;
  return segment([kx, SAFE.y + 10 - Math.cos(a) * 3.4, 20 - Math.sin(a) * 3.4], [kx, SAFE.y + 10 + Math.cos(a) * 3.4, 20 + Math.sin(a) * 3.4], P);
};

const svg = document.querySelector(".iso-stage svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const capsule = part("capsule"), payload = part("payload"), pointer = part("pointer"), key = part("key");
const drawers = [0, 1, 2].map((i) => part("drawer-" + i)), slips = [0, 1, 2].map((i) => part("slip-" + i));
const lamps = { unlock: part("lamp-unlock"), posthog: part("lamp-posthog"), attacker: part("lamp-attacker") };
const slots = { back: svg.querySelector('[data-slot="back"]'), line: svg.querySelector('[data-slot="line"]'), front: svg.querySelector('[data-slot="front"]') };

function phaseOf(t, fixed) {
  if (t >= T.reset) return "resetting";
  if (t < T.drawers[0]) return fixed ? "Trust Wallet 2.69 · unlock" : "Trust Wallet 2.68 · unlock";
  if (fixed) return t < T.fork[0] ? "analytics event · no seed in it" : "api_host → PostHog · as usual";
  if (t < T.pack[0]) return "GET_SEED_PHRASE · every wallet";
  if (t < T.ride[0]) return "seed → errorMessage field";
  if (t < T.fork[1]) return "api_host → api.metrics-trustwallet.com";
  return "seed phrases delivered · ~$7M drained";
}

runFigure({
  cycle: T.cycle,
  scrubEnd: 8.4,
  steps: [0.2, T.seeds[1], T.pack[1], T.ride[1], T.fork[1] + 0.3],
  label: (fixed) => (fixed ? "Fixed: clean 2.69" : "Apply the fix: update to 2.69"),
  phase: phaseOf,
  draw(t, fixed) {
    const back = 1 - ease(T.reset, T.reset + 0.6, t);
    const unlock = ease(...T.unlock, t) * back;
    key.setAttribute("d", keyD(unlock));
    lamps.unlock.style.opacity = unlock.toFixed(3);
    // 2.68 only: the backdoor opens every wallet and pulls its seed phrase into the capsule
    const open = fixed ? 0 : ease(...T.drawers, t) * (1 - ease(T.pack[1], T.pack[1] + 0.6, t));
    drawers.forEach((d) => d.setAttribute("transform", translateAlong(P, [0, 8 * open, 0])));
    slips.forEach((s, i) => {
      const rise = ease(T.seeds[0] + i * 0.15, T.seeds[0] + i * 0.15 + 0.4, t);
      const go = ease(T.pack[0] + i * 0.1, T.pack[0] + i * 0.1 + 0.6, t);
      const [dx, dy, dz] = SLIP_TO[i];
      s.setAttribute("transform", translateAlong(P, [dx * go, 8 * open * (1 - go) + dy * go, 6 * rise * (1 - go) + dz * go]));
      s.style.opacity = (fixed ? 0 : rise * (1 - ease(T.pack[1] - 0.1, T.pack[1] + 0.1, t))).toFixed(3);
    });
    payload.style.opacity = (fixed ? 0 : ease(T.pack[1] - 0.1, T.pack[1] + 0.1, t) * back).toFixed(3);
    // api_host: the selector is the only part that differs between 2.68 and 2.69
    const to = fixed ? 0 : 1;
    pointer.setAttribute("d", pointerD(to));
    const ride = ease(...T.ride, t), fork = ease(...T.fork, t);
    let x = PATH.start + (PATH.turret - PATH.start) * ride, y = 0, slot = "line";
    let seen = 1 - ease(T.ride[1] - 0.25, T.ride[1], t);
    if (t >= T.fork[0]) {
      x = SEL[0];
      const end = fixed ? PATH.back : PATH.front;
      const startY = fixed ? SEL[1] - 12 : SEL[1] + 12;
      y = startY + (end - startY) * fork - SEL[1];
      slot = fixed ? "back" : "front";
      seen = ease(T.fork[0], T.fork[0] + 0.2, t) * (1 - ease(T.fork[1], T.fork[1] + 0.3, t));
    }
    if (capsule.parentNode !== slots[slot]) slots[slot].appendChild(capsule);
    capsule.setAttribute("transform", translateAlong(P, [x, y, 0]));
    capsule.style.opacity = (seen * back).toFixed(3);
    const arrived = ease(T.fork[1], T.fork[1] + 0.15, t) * back;
    lamps.posthog.style.opacity = (fixed ? arrived : 0).toFixed(3);
    lamps.attacker.style.opacity = (fixed ? 0 : arrived).toFixed(3);
  },
});

new ResizeObserver(() => parent.postMessage({ figure: "trust-wallet-supply-chain-christmas-heist", height: Math.ceil(document.body.getBoundingClientRect().height) }, "/")).observe(document.body);
</script></body></html>
